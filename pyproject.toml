[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "os-optics"
dynamic = ["version"]
description = "OS Optics (OpenSci): the local optical design engine. Public optical catalog, multi-element optical Projects, deterministic offline simulation, Local Validation and a 3D Optical Simulation View."
readme = "docs/engine/README.md"
requires-python = ">=3.11"
# MIT from 0.14.0 (PEP 639 metadata). Releases 0.13.0 and earlier were published under their earlier licence, which
# continues to apply to those releases.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "OpenSci" }]
keywords = ["optics", "optical design", "ray tracing", "gaussian beam", "polarization", "simulation", "opensci", "os-optics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]
# Dependency policy: lower bound = oldest tested version (the whole suite passes with exactly these floors on Python 3.11),
# upper bound = next major (the Pyodide 314.0.x versions fit).
dependencies = [
  "numpy>=2.3,<3",
  "scipy>=1.16,<2",
  "pydantic>=2.11.5,<3",
  "shapely>=2.1,<3",
]

[project.optional-dependencies]
# Opening protected Assembly Preview / Assembly Detail deliveries (os_optics.protected_delivery) needs an AES-256-GCM
# implementation: the maintained PyCA package, imported lazily. Everything else (the local design workflow, local assembly
# validation, the Detailed Assembly Drawing, artifact uploads) works without it, so it is an extra, never a core dependency.
protected = ["cryptography>=50.0.1,<51"]
test = ["pytest>=8", "pytest-cov>=5", "cryptography>=50.0.1,<51"]

[project.urls]
Homepage = "https://opensci-optics.com/"
Documentation = "https://github.com/JunLin615/os-optics/blob/main/docs/engine/README.md"
Source = "https://github.com/JunLin615/os-optics"
Issues = "https://github.com/JunLin615/os-optics/issues"

[project.scripts]
os-optics = "os_optics.cli:main"

[tool.uv]
# Rebuild the cached wheel whenever the project file, a packaged source/data file or the commit changes.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "LICENSE" },
  { file = "docs/engine/README.md" },
  { file = "src/**/*.py" },
  { file = "src/**/*.json" },
  { file = "src/**/*.toml" },
  { file = "src/**/py.typed" },
  { file = "src/**/*.js" },
  { file = "src/**/*.css" },
  { file = "src/**/*.html" },
  { file = "src/**/*.txt" },
  { git = { commit = true } },
]

[tool.hatch.version]
path = "src/os_optics/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/os_optics"]

[tool.hatch.build.targets.sdist]
# The source distribution carries the package, its README (the PyPI description) and the licence.
include = ["/src/os_optics", "/docs/engine/README.md", "/LICENSE"]
exclude = ["__pycache__", "*.pyc", "*.pyo", ".DS_Store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "golden: physics golden cases with independent references",
  "pyodide: requires node + pinned Pyodide (network on cold cache)",
  "install: builds a wheel and installs it into a clean venv",
]

[tool.coverage.run]
source = ["os_optics"]
branch = true

[tool.coverage.report]
show_missing = true
