name: Feature, engine change or documentation
description: Propose a capability, engine change, guide, or translation.
title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: |
        Write in Chinese or English.
        See [CONTRIBUTING.md](https://github.com/JunLin615/os-optics/blob/main/CONTRIBUTING.md).
        This issue is public: describe the work so anyone can reproduce and check it, and don't include tokens, passwords or personal data.
        User guides: [English](https://github.com/JunLin615/os-optics/blob/main/docs/en/README.md) · [简体中文](https://github.com/JunLin615/os-optics/blob/main/docs/zh-CN/README.md).
  - type: textarea
    id: suggestion
    attributes:
      label: Remaining work
      description: What has to change, stated as concrete deliverables.
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Background
      description: Optional. Your experiment or workflow, motivation, and links.
  - type: textarea
    id: where
    attributes:
      label: Where the work lives
      description: The files or modules involved, such as a module path under `os_optics/` or a page under `docs/`.
      placeholder: "os_optics/... or docs/en/catalog.md"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: Checkable items — given input -> expected output, command -> result, or a test that fails before and passes after.
      placeholder: "- [ ] given input -> expected output, command -> result, or a test that fails before and passes after"
    validations:
      required: true
