name: Bug report
description: Help us reproduce a problem with the engine or its documentation.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Please write the report in English; you may add your original wording below it.
        See [CONTRIBUTING.md](https://github.com/JunLin615/os-optics/blob/main/CONTRIBUTING.md).
        User guides: [English](https://github.com/JunLin615/os-optics/blob/main/docs/en/README.md) · [简体中文](https://github.com/JunLin615/os-optics/blob/main/docs/zh-CN/README.md).
  - type: textarea
    id: summary
    attributes:
      label: Observed vs expected
      description: Describe your task, the observed result, and the expected result.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the exact commands or a small example project, with input values and units. Include the catalog version if relevant.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Installed engine version
      description: >-
        Run `os-optics doctor` or `python -c "from importlib.metadata import version; print(version('os-optics'))"`
        in the environment that reproduces the problem.
      placeholder: "0.13.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Windows 11, Python 3.12"
  - type: textarea
    id: output
    attributes:
      label: Result status and relevant output
      description: Include the reported status, process exit code, target values with units and bounds, and relevant issue codes, messages, suggested actions, or traceback. Attach a screenshot if helpful.
  - type: textarea
    id: where
    attributes:
      label: Where the work lives
      description: The documentation page or engine module involved (for example a path under `os_optics/`). Write "unknown" if you are not sure.
      placeholder: "os_optics/... or docs/en/results.md"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: Checkable items that show the bug is fixed — given input -> expected output, command -> result, or a test that fails before and passes after.
      value: |
        - [ ] 
    validations:
      required: true
