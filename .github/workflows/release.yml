name: Release

# A published GitHub release builds the distributions of the tagged commit and publishes them to PyPI through Trusted
# Publishing (environment "pypi"), with PyPI attestations (build provenance). The tag must be v<version> of
# src/os_optics/_version.py and the tagged commit must be on main.
#
# A manual run (workflow_dispatch) is the build-only path: it runs every check of a release for the tag it is given --
# the tag/version guard, the main-ancestry guard, the reproducible build, twine and the distribution checks, a clean
# install -- and uploads the distributions as a workflow artifact. When the tag exists it builds the commit the tag names;
# when it does not, it builds the head of the branch the run was started on and still checks the tag name against that
# commit's version (the way to exercise a tag/version mismatch). The run summary says which. A manual run never reaches
# the publish job, which runs only on a published release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to validate as if it were released (e.g. v0.14.0): its commit is built when the tag exists, else the branch head. Nothing is published."
        required: true
        type: string
      check_main:
        description: "Also require the built commit to be on main (as a release does)."
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the whole history, so the tagged commit can be checked against main
          fetch-depth: 0
      - name: What to build
        id: target
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          if [ "$EVENT" = "release" ]; then
            commit="$GITHUB_SHA"; what="the released tag $TAG"
          elif tagged=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}"); then
            git checkout -q --detach "$tagged"
            commit="$tagged"; what="the commit tag $TAG names"
          else
            commit="$GITHUB_SHA"; what="the head of $GITHUB_REF_NAME (tag $TAG does not exist: only its name is checked)"
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          {
            echo "### Release build ($EVENT)"
            echo "- tag: \`$TAG\`"
            echo "- built: $what, \`$commit\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install the pinned build and check tools
        run: python -m pip install --require-hashes -r scripts/build-requirements.txt -r scripts/check-requirements.txt
      - name: The release tag names this version and the commit is on main
        env:
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
          CHECK_MAIN: ${{ github.event_name == 'release' || inputs.check_main }}
          COMMIT: ${{ steps.target.outputs.commit }}
        run: |
          args=(--tag "$TAG")
          if [ "$CHECK_MAIN" = "true" ]; then args+=(--commit "$COMMIT" --main-ref origin/main); fi
          status=0
          python scripts/release_guard.py "${args[@]}" > "$RUNNER_TEMP/guard.json" || status=$?
          cat "$RUNNER_TEMP/guard.json"
          echo "- guards: \`$(cat "$RUNNER_TEMP/guard.json")\`" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Build (scripts/build_dist.py, the build entry point CI uses)
        run: python scripts/build_dist.py --outdir dist
      - name: Check metadata and contents
        run: |
          python -m twine check --strict dist/*.whl dist/*.tar.gz
          python scripts/check_dist.py dist
      - name: Clean install of the wheel
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/python" -m pip install "$(ls "$GITHUB_WORKSPACE"/dist/os_optics-*.whl)[protected]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/clean/bin/os-optics" --version
          "$RUNNER_TEMP/clean/bin/python" -I - "$GITHUB_WORKSPACE/dist/identity.json" <<'PY'
          import json, sys
          import os_optics
          from os_optics.manifest.build import engine_build_id
          identity = json.load(open(sys.argv[1]))
          assert os_optics.__version__ == identity["version"] and engine_build_id() == identity["engine_build_id"]
          print(json.dumps({"version": os_optics.__version__, "engine_build_id": engine_build_id()}))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: identity
          path: dist/identity.json
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish to PyPI
    needs: build
    # Only a published GitHub release publishes; a manual run stops after the build job.
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/os-optics/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          attestations: true
